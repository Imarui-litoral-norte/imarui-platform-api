# ========= SERVER =========
server.port=${CORE_API_PORT:80}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.server.base-url=http://localhost:${server.port}

# JPA / Hibernate (WRITE)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========= SECURITY =========
# ========= JWT =========

# ========= FRONTEND =========
app.frontend.url=${APP_FRONTEND_URL:http://127.0.0.1:8091}

# ========= AUTH/TTL =========
membership.activation-token-ttl=72h

# ========= BOOTSTRAP/INICIAL =========

# ========= CORS =========
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:80,http://127.0.0.1:80,http://localhost,http://127.0.0.1,http://localhost:81,http://127.0.0.1:81,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8091,http://127.0.0.1:8091,http://localhost:8191,http://127.0.0.1:8191}

# ========= SWAGGER =========
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
